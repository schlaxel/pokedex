backend:
  name: git-gateway
  branch: main

local_backend:
  url: http://localhost:8081/api/v1

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: pokemon
    label: Pokemon
    label_singular: Pokemon
    folder: content/pokemon
    create: true
    delete: true
    slug: "{{fields.id}}-{{slug}}"
    extension: json
    format: json
    identifier_field: name
    summary: "{{id}} - {{name}}"
    fields:
      - { label: ID, name: id, widget: string, hint: "Required and should stay unique. Use a padded number like 011 or 012.", pattern: ["^[0-9]{3,}$", "Use numeric IDs like 001, 010, 011."] }
      - { label: Name, name: name, widget: string }
      - { label: Bio, name: bio, widget: text, default: "" }
      - label: Fun Facts
        name: funFacts
        widget: list
        summary: "{{fields.fact}}"
        default:
          - ""
        field: { label: Fact, name: fact, widget: string }
      - { label: Type, name: type, widget: string, default: "Normal" }
      - { label: Height, name: height, widget: string, required: false, hint: "Example: 1,8 m" }
      - { label: Weight, name: weight, widget: string, required: false, hint: "Example: 85 kg" }
      - label: Weaknesses
        name: weaknesses
        widget: list
        required: false
        summary: "{{fields.weakness}}"
        field: { label: Weakness, name: weakness, widget: string }
      - label: Stats
        name: stats
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: KP, name: hp, widget: number, required: false, value_type: int, min: 0 }
          - { label: Angriff, name: attack, widget: number, required: false, value_type: int, min: 0 }
          - { label: Verteidigung, name: defense, widget: number, required: false, value_type: int, min: 0 }
      - { label: Location Name, name: locationName, widget: string, required: false, default: "Freiburg im Breisgau" }
      - { label: Map Location, name: location, widget: map, type: Point, decimals: 6, required: false, hint: "Optional. Pick the Pokemon location directly on the map." }
      - { label: Image, name: image, widget: image, required: false, media_library: { config: { multiple: false } } }
